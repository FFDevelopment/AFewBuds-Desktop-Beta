name: Publish desktop beta
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml', 'RELEASE_NOTES.md']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: desktop-beta-release
  cancel-in-progress: false
jobs:
  launcher:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
        with:
          repository: FFDevelopment/afewbuds-3d-prototype
          ref: 87dbd861b4d6b2e975522fea724f4a02103b4489
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test update transactions and Windows file locking
        run: python -m unittest discover -s launcher -v
      - name: Build standalone Windows launcher
        run: |
          python -m pip install pyinstaller==6.22.3 Pillow==11.3.0
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name AFewBuds --icon game/assets/branding/afb_app_icon.png --paths launcher launcher/main.py
      - name: Verify bundled launcher UI starts and exits
        run: |
          $process = Start-Process -FilePath (Resolve-Path dist/AFewBuds.exe) -ArgumentList '--ui-smoke' -PassThru
          if (-not $process.WaitForExit(30000)) { Stop-Process -Id $process.Id; throw 'Launcher UI timed out' }
          if ($process.ExitCode -ne 0) { throw "Launcher UI failed: $($process.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-launcher
          path: source/dist/AFewBuds.exe
          if-no-files-found: error
  release:
    needs: launcher
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: FFDevelopment/afewbuds-3d-prototype
          ref: 87dbd861b4d6b2e975522fea724f4a02103b4489
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: windows-launcher
          path: source/launcher-binary
      - name: Test updater on Linux
        run: python -m unittest discover -s launcher -v
      - name: Identify packaged version
        id: release
        run: |
          python -c 'import re; from pathlib import Path; print("version=" + re.search(r"config/version=\"([^\"]+)", Path("game/project.godot").read_text()).group(1))' >> "$GITHUB_OUTPUT"
      - name: Install Godot 4.7.2 and desktop export templates
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          echo /tmp/godot >> "$GITHUB_PATH"
          curl -fL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          unzip -j -q /tmp/templates.tpz 'templates/windows_release_x86_64.exe' 'templates/windows_release_x86_64_console.exe' 'templates/linux_release.x86_64' 'templates/version.txt' -d ~/.local/share/godot/export_templates/4.7.2.stable
      - name: Recover and retain pinned AFewBuds assets on first build
        run: |
          set -euo pipefail
          if [ ! -f game/assets/.recovered-source ]; then
            python tools/recover_assets.py /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          fi
      - name: Import editable assets
        run: Godot_v4.7.2-stable_linux.x86_64 --headless --path game --editor --import --quit
      - name: Test movement, interactions, and isolated saves
        run: python tools/test.py /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Export desktop builds
        run: |
          set -euo pipefail
          mkdir -p build/windows build/linux
          Godot_v4.7.2-stable_linux.x86_64 --headless --path game --export-release 'Windows Desktop' 2>&1 | tee build/windows-export.log
          Godot_v4.7.2-stable_linux.x86_64 --headless --path game --export-release 'Linux' 2>&1 | tee build/linux-export.log
          if grep -E 'SCRIPT ERROR|^ERROR:' build/*-export.log; then exit 1; fi
          chmod +x build/linux/AFewBuds-3D-Prototype.x86_64
          build/linux/AFewBuds-3D-Prototype.x86_64 --headless --quit-after 120 2>&1 | tee build/runtime.log
          if grep -E 'SCRIPT ERROR|^ERROR:' build/runtime.log; then exit 1; fi
          XDG_DATA_HOME="$(mktemp -d)" timeout 60s build/linux/AFewBuds-3D-Prototype.x86_64 --headless -- --export-smoke 2>&1 | tee build/exported-world.log
          if grep -E 'SCRIPT ERROR|^ERROR:' build/exported-world.log; then exit 1; fi
          grep -q 'EXPORTED_WORLD_RESULT: PASS' build/exported-world.log
          printf 'AFewBuds Desktop %s\nSource: %s\n' '${{ steps.release.outputs.version }}' '87dbd861b4d6b2e975522fea724f4a02103b4489' > build/windows/BUILD_VERSION.txt
          cp build/windows/BUILD_VERSION.txt build/linux/BUILD_VERSION.txt
          cp ../README.md build/windows/README.md
          cp ../README.md build/linux/README.md
          cp launcher-binary/AFewBuds.exe build/windows/AFewBuds.exe
          cp launcher-binary/AFewBuds.exe build/AFewBuds-Launcher.exe
          python tools/package_source.py
      - name: Package verified builds
        run: |
          set -euo pipefail
          cd build/windows
          zip -r ../AFewBuds-Windows-Beta.zip .
          cd ../linux
          zip -r ../AFewBuds-Linux-Beta.zip .
          cd ..
          sha256sum AFewBuds-Windows-Beta.zip AFewBuds-Linux-Beta.zip AFewBuds-3D-Prototype-Source.zip AFewBuds-Launcher.exe > SHA256SUMS.txt
      - name: Publish beta download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --target "${{ github.sha }}" --prerelease --title "AFewBuds Desktop Beta ${{ steps.release.outputs.version }}" --notes-file ../RELEASE_NOTES.md build/AFewBuds-Windows-Beta.zip build/AFewBuds-Linux-Beta.zip build/AFewBuds-3D-Prototype-Source.zip build/SHA256SUMS.txt build/AFewBuds-Launcher.exe
